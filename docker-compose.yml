# ─────────────────────────────────────────────────────────────────────
# Restaurant Direct — Local Development Services
# ─────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d        # Start services
#   docker compose down         # Stop services
#   docker compose down -v      # Stop and destroy volumes (reset data)
# ─────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-direct-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_direct_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_direct_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
