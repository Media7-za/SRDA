<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e5b224",
                        "background-light": "#f8f7f6",
                        "background-dark": "#211d11",
                        "thai-gold": "#e5b224",
                        "charcoal": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden pb-32">
<!-- Header Section -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 sticky top-0 z-10">
<div class="text-charcoal dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-thai-gold/10 cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-charcoal dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Checkout</h2>
</div>
<!-- Order Mode Toggle -->
<div class="flex px-4 py-3">
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-thai-gold/10 p-1.5">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-thai-gold has-[:checked]:text-charcoal text-thai-gold/80 text-sm font-semibold transition-all duration-200">
<span class="truncate">Pickup</span>
<input checked="" class="invisible w-0" name="order-mode" type="radio" value="Pickup"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-thai-gold has-[:checked]:text-charcoal text-thai-gold/80 text-sm font-semibold transition-all duration-200">
<span class="truncate">Delivery</span>
<input class="invisible w-0" name="order-mode" type="radio" value="Delivery"/>
</label>
</div>
</div>
<!-- Contact Details Card -->
<div class="px-4 py-2">
<div class="bg-white dark:bg-zinc-900/50 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-zinc-800">
<h3 class="text-charcoal dark:text-slate-100 text-base font-bold mb-4">Contact details</h3>
<div class="space-y-4">
<label class="flex flex-col w-full">
<p class="text-slate-600 dark:text-slate-400 text-xs font-medium pb-1.5 ml-1 uppercase tracking-wider">Name</p>
<input class="form-input flex w-full rounded-xl text-charcoal dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-thai-gold border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-800 h-12 placeholder:text-slate-400 px-4 text-base font-medium" placeholder="Enter your name" value="John Doe"/>
</label>
<label class="flex flex-col w-full">
<p class="text-slate-600 dark:text-slate-400 text-xs font-medium pb-1.5 ml-1 uppercase tracking-wider">Phone Number</p>
<input class="form-input flex w-full rounded-xl text-charcoal dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-thai-gold border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-800 h-12 placeholder:text-slate-400 px-4 text-base font-medium" placeholder="Enter your phone number" value="+1 (555) 000-0000"/>
</label>
</div>
</div>
</div>
<!-- Collection Time -->
<div class="px-4 py-2">
<div class="bg-white dark:bg-zinc-900/50 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-zinc-800">
<div class="flex items-center justify-between mb-2">
<h3 class="text-charcoal dark:text-slate-100 text-base font-bold">Collection Time</h3>
<span class="text-thai-gold text-sm font-semibold">Change</span>
</div>
<div class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-zinc-800 rounded-lg">
<span class="material-symbols-outlined text-thai-gold">schedule</span>
<p class="text-slate-700 dark:text-slate-200 text-sm font-medium">As soon as possible (15-20 min)</p>
</div>
</div>
</div>
<!-- Payment Method -->
<div class="px-4 py-2">
<div class="bg-white dark:bg-zinc-900/50 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-zinc-800">
<h3 class="text-charcoal dark:text-slate-100 text-base font-bold mb-4">Payment Method</h3>
<div class="space-y-3">
<label class="flex items-center justify-between p-4 rounded-xl border-2 border-thai-gold bg-thai-gold/5 cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-thai-gold">payments</span>
<span class="text-charcoal dark:text-slate-100 font-semibold">Pay In-Store</span>
</div>
<input checked="" class="text-thai-gold focus:ring-thai-gold h-5 w-5 border-slate-300" name="payment" type="radio"/>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-800/50 cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">credit_card</span>
<span class="text-slate-600 dark:text-slate-300 font-medium">Credit Card Online</span>
</div>
<input class="text-thai-gold focus:ring-thai-gold h-5 w-5 border-slate-300" name="payment" type="radio"/>
</label>
</div>
</div>
</div>
<!-- Order Summary Accordion -->
<div class="px-4 py-2">
<div class="bg-white dark:bg-zinc-900/50 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-zinc-800 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-slate-100 dark:bg-zinc-800 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-500 text-sm">shopping_bag</span>
</div>
<div>
<p class="text-charcoal dark:text-slate-100 font-bold">Order Summary</p>
<p class="text-slate-500 dark:text-slate-400 text-xs">3 items - $37.00</p>
</div>
</div>
<span class="material-symbols-outlined text-slate-400">keyboard_arrow_down</span>
</div>
</div>
<!-- Sticky Bottom Button Area -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-slate-200 dark:border-zinc-800">
<button class="w-full bg-thai-gold hover:bg-thai-gold/90 text-charcoal font-bold py-4 rounded-xl shadow-lg shadow-thai-gold/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
<span>Place Order</span>
<span class="w-1.5 h-1.5 rounded-full bg-charcoal/20"></span>
<span>$37.00</span>
</button>
<div class="mt-3 text-center">
<p class="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest font-bold">Secure checkout powered by ThaiGold</p>
</div>
</div>
</div>
</body></html>
